name: Daily Random Commit

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Random chance commit
        run: |
          R=$((RANDOM%3))
          if [ $R -eq 0 ]; then
            echo "Updated on $(date)" >> log.txt
            git config --global user.name "22230902mani"
            git config --global user.email "151734916+22230902mani@users.noreply.github.com"
            git add .
            git commit -m "Random activity commit"
            git push
          else
            echo "No commit this time"
          fi
